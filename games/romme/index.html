<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rommé</title>
<link rel="stylesheet" href="../common.css">
<style>
  :root { --cw: 70px; --ch: calc(var(--cw) * 1.357); }
  body {
    display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 50% 40%, #2f8a57 0%, #21693f 60%, #184f30 100%);
    color: #fff;
  }
  .toolbar { color: var(--ui-text); }
  .opponents { display: flex; gap: 10px; justify-content: center; padding: 8px 10px 0; flex-wrap: wrap; }
  .opp {
    min-width: 160px; padding: 8px 12px; border-radius: 12px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: background .2s, box-shadow .2s;
  }
  .opp.turn { background: rgba(255,255,255,.26); box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
  .opp .name { font-weight: 600; }
  .opp .fan { display: flex; height: 34px; }
  .opp .fan img { width: 24px; height: 33px; margin-left: -16px; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .opp .fan img:first-child { margin-left: 0; }
  .opp .msg { font-size: 12px; opacity: .85; min-height: 15px; text-align: center; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.25); margin-left: 4px; }

  .middle { flex: 1; display: flex; gap: 12px; padding: 10px 12px; min-height: 0; }
  .piles { display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; }
  .pile { position: relative; width: var(--cw); height: var(--ch); border-radius: 6px; border: 2px dashed rgba(255,255,255,.35); cursor: pointer; padding: 0; background: none; }
  .pile img { width: 100%; height: 100%; display: block; border-radius: 6px; box-shadow: 0 3px 6px rgba(0,0,0,.35); }
  .pile.active { box-shadow: 0 0 0 3px #ffe36b; border-radius: 8px; }
  .pile .count { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .85; }
  .pile-label { font-size: 12px; opacity: .85; margin-bottom: -6px; }

  .table {
    flex: 1; overflow: auto; border-radius: 14px; padding: 10px;
    background: rgba(0,0,0,.12); border: 1px solid rgba(255,255,255,.12);
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px 16px;
  }
  .table .empty { opacity: .7; font-size: 14px; margin: auto; text-align: center; }
  .meld { position: relative; display: flex; padding: 4px 6px 4px; border-radius: 10px; cursor: default; transition: background .15s, box-shadow .15s; }
  .meld .owner { position: absolute; top: -2px; left: 8px; font-size: 10px; opacity: .7; transform: translateY(-100%); }
  .meld img { width: calc(var(--cw) * .8); height: calc(var(--ch) * .8); margin-left: calc(var(--cw) * -.48); border-radius: 5px; box-shadow: -1px 1px 3px rgba(0,0,0,.3); }
  .meld img:first-of-type { margin-left: 0; }
  .meld.mine-new { box-shadow: 0 0 0 2px rgba(255,227,107,.7); }
  .meld.target { cursor: pointer; background: rgba(255,227,107,.18); box-shadow: 0 0 0 2px #ffe36b; }

  .bottom { padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .status { text-align: center; font-size: 14px; min-height: 20px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .actions-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .hand { position: relative; display: flex; justify-content: center; padding-top: 14px; min-height: calc(var(--ch) + 18px); }
  .card {
    width: var(--cw); height: var(--ch); padding: 0; border: 0; background: none; cursor: pointer; flex: none;
    transition: transform .12s, margin .12s; position: relative;
  }
  .card img { width: 100%; height: 100%; display: block; border-radius: 6px; box-shadow: -1px 2px 4px rgba(0,0,0,.35); pointer-events: none; }
  .card:hover { transform: translateY(-5px); }
  .card.sel { transform: translateY(-16px); }
  .card.sel img { box-shadow: 0 0 0 3px #ffe36b, -1px 2px 4px rgba(0,0,0,.35); }
  .card.new img { box-shadow: 0 0 0 3px #7fd3ff, -1px 2px 4px rgba(0,0,0,.35); }
  .hand.turn::before { content: ""; position: absolute; inset: 6px 10% -4px; border-radius: 14px; background: rgba(255,255,255,.08); box-shadow: 0 0 0 2px rgba(255,255,255,.4); pointer-events: none; }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn primary" id="newBtn">Neues Spiel</button>
    <label class="stat">NPCs
      <select class="btn" id="npcSel"><option>1</option><option selected>2</option><option>3</option></select>
    </label>
    <label class="stat"><input type="checkbox" id="openRule" checked> Erstauslage 40</label>
    <span class="spacer"></span>
    <span class="stat" id="roundInfo"></span>
    <button class="btn" id="scoreBtn">Punkte</button>
    <button class="btn" id="helpBtn">Regeln</button>
  </div>

  <div class="opponents" id="opps"></div>

  <div class="middle">
    <div class="piles">
      <span class="pile-label">Stapel</span>
      <button class="pile" id="stock" title="Karte ziehen"><img src="../../assets/cards/cardBack_blue2.png" alt="Stapel"><span class="count" id="stockCount"></span></button>
      <span class="pile-label" style="margin-top:14px">Ablage</span>
      <button class="pile" id="discard" title="Ablage"></button>
    </div>
    <div class="table" id="table"></div>
  </div>

  <div class="bottom">
    <div class="status" id="status"></div>
    <div class="actions-row">
      <button class="btn primary" id="meldBtn">Auslegen</button>
      <button class="btn" id="discardBtn">Abwerfen</button>
      <button class="btn" id="resetBtn">Zug zurücknehmen</button>
      <button class="btn" id="sortBtn">Sortieren: Farbe</button>
    </div>
    <div class="hand" id="hand"></div>
  </div>

  <div class="overlay" id="dlg" hidden><div class="panel" id="dlgPanel"></div></div>
  <div class="toast" id="toast"></div>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
