<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rennen</title>
<link rel="stylesheet" href="../common.css">
<style>
  body { background: #3e8f45; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Menü ---------- */
  .menu {
    position: absolute; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; gap: 14px;
    background: rgba(25, 45, 30, .35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    overflow: auto;
  }
  .menu[hidden] { display: none; }
  .menu h1 { margin: 0; color: #fff; font-size: 30px; letter-spacing: .5px; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .cols { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 14px; width: min(1080px, 100%); }
  .col {
    background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.95);
    border-radius: 16px; padding: 14px 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,.2);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    min-width: 0;
  }
  .col h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--ui-dim); }
  .hs-track { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  ol.hs { margin: 0; padding: 0; list-style: none; counter-reset: n; font-size: 14px; }
  ol.hs li {
    counter-increment: n; display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: center;
    padding: 5px 4px; border-bottom: 1px solid rgba(24,34,46,.07);
  }
  ol.hs li::before { content: counter(n) "."; color: var(--ui-dim); font-variant-numeric: tabular-nums; }
  ol.hs li:nth-child(1)::before { color: #c99a06; font-weight: 700; }
  ol.hs li .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.hs li .who small { color: var(--ui-dim); }
  ol.hs li b { font-variant-numeric: tabular-nums; }
  ol.hs li.empty { color: var(--ui-dim); }
  ol.hs li.new { background: #fff3c4; border-radius: 6px; }

  .tracks { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: flex; align-items: center; gap: 12px; width: 100%;
    border: 2px solid transparent; background: rgba(255,255,255,.75); border-radius: 12px;
    padding: 6px 10px; cursor: pointer; text-align: left;
    transition: border-color .12s, background .12s;
  }
  .choice:hover { background: #fff; }
  .choice.on { border-color: var(--accent); background: #fff; box-shadow: 0 2px 10px rgba(47,124,246,.18); }
  .choice canvas { width: 120px; height: 72px; border-radius: 8px; background: #4ea152; flex: none; }
  .choice b { display: block; font-size: 15px; }
  .choice small { color: var(--ui-dim); font-size: 12px; }

  .vehicles { display: flex; flex-direction: column; gap: 8px; }
  .vehicle .pic { width: 56px; height: 72px; display: grid; place-items: center; flex: none; }
  .vehicle .pic img { max-width: 100%; max-height: 100%; }
  .bars { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; font-size: 11px; color: var(--ui-dim); margin-top: 4px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(24,34,46,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .colors { display: flex; gap: 8px; margin-top: 10px; align-items: center; font-size: 13px; color: var(--ui-dim); }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.15); padding: 0; }
  .sw.on { box-shadow: 0 0 0 3px var(--accent); }
  .keys { font-size: 12px; color: var(--ui-dim); margin-top: 12px; line-height: 1.6; }
  kbd { display: inline-block; min-width: 20px; text-align: center; padding: 0 4px; border-radius: 4px; border: 1px solid rgba(24,34,46,.2); background: #fff; font: 600 11px system-ui; }
  .startbar { display: flex; gap: 10px; align-items: center; }
  .startbar .btn { font-size: 17px; padding: 10px 34px; }

  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; }
    .menu { justify-content: flex-start; }
  }

  .hud-btn { position: absolute; right: 10px; top: 10px; z-index: 20; }
  .hud-btn .btn { background: rgba(255,255,255,.8); padding: 4px 10px; font-size: 13px; }
  .panel input { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(24,34,46,.2); width: 100%; }
  .touch { position: absolute; bottom: 12px; left: 0; right: 0; display: none; justify-content: space-between; padding: 0 14px; z-index: 20; pointer-events: none; }
  .touch div { display: flex; gap: 10px; pointer-events: auto; }
  .touch button { width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(255,255,255,.7); background: rgba(255,255,255,.35); font-size: 24px; color: #fff; touch-action: none; }
  @media (pointer: coarse) { .touch.show { display: flex; } }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud-btn" id="hudBtns" hidden><button class="btn" id="pauseBtn">Pause (P)</button> <button class="btn" id="menuBtn">Menü</button></div>
  <div class="touch" id="touch">
    <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div><button data-k="down">▼</button><button data-k="up">▲</button></div>
  </div>

  <div class="menu" id="menu">
    <h1>Rennen</h1>
    <div class="cols">
      <section class="col">
        <h2>Bestenliste – Top 10</h2>
        <div class="hs-track" id="hsTrack"></div>
        <ol class="hs" id="hsList"></ol>
      </section>
      <section class="col">
        <h2>Strecke</h2>
        <div class="tracks" id="tracks"></div>
      </section>
      <section class="col">
        <h2>Fahrzeug</h2>
        <div class="vehicles" id="vehicles"></div>
        <div class="colors" id="colors">Farbe</div>
        <div class="keys">
          <kbd>↑</kbd>/<kbd>W</kbd> Gas · <kbd>↓</kbd>/<kbd>S</kbd> Bremsen &amp; langsam rückwärts<br>
          <kbd>←</kbd>/<kbd>A</kbd> links · <kbd>→</kbd>/<kbd>D</kbd> rechts · <kbd>P</kbd> Pause<br>
          3 Runden gegen einen Computergegner.
        </div>
      </section>
    </div>
    <div class="startbar"><button class="btn primary" id="goBtn">Rennen starten</button></div>
  </div>

  <div class="overlay" id="dlg" hidden><div class="panel" id="dlgPanel"></div></div>
  <script src="tracks.js"></script>
  <script src="game.js"></script>
</body>
</html>
